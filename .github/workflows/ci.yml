name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env de exemplo
        run: cp .env.example .env

      - name: Validar manifests Kubernetes
        run: kubectl kustomize . > /dev/null

      - name: Subir app + banco + cache
        run: docker compose up -d --build --wait app

      - name: Smoke test da API
        run: |
          curl -fsS localhost:3000/health
          curl -fsS -X POST localhost:3000/tasks -H 'content-type: application/json' -d '{"title":"ci"}'
          curl -fsS localhost:3000/tasks | grep -q '"title":"ci"'
          curl -fsS localhost:3000/metrics | grep -q http_requests_total

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tarefas-api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Publicar imagem no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
