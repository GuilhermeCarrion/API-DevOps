apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: tarefas-secrets, key: GRAFANA_PASSWORD } }
            - name: DISCORD_WEBHOOK_URL
              valueFrom: { secretKeyRef: { name: tarefas-secrets, key: DISCORD_WEBHOOK_URL } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: alerting, mountPath: /etc/grafana/provisioning/alerting }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-providers, configMap: { name: grafana-dashboard-providers } }
        - { name: alerting, configMap: { name: grafana-alerting } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, nodePort: 30300 }]
