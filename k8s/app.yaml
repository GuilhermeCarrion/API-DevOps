apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels: { app: tarefas-api }
  template:
    metadata:
      labels: { app: tarefas-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: app
          image: tarefas-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: tarefas-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgres://tarefas:$(POSTGRES_PASSWORD)@db:5432/tarefas
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  type: NodePort
  selector: { app: tarefas-api }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30000 }]
